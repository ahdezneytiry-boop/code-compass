<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>灵感便签</title>

</head>
<body>
  <header><h1>把想到的，先记下来。</h1><p>不必完整，一句话也可以。</p></header>

</body>
</html>
